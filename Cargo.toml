[workspace]
members = ["crypto-core", "relay"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bytepotato-ug/pizzini"
authors = ["bytepotato"]
rust-version = "1.80"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.release.package."*"]
opt-level = 3

# A Rust panic must never unwind across the `extern "C"` FFI boundary
# into the Swift runtime. `panic = "abort"` is set on every profile —
# not release-only — so a debug XCFramework build cannot reintroduce
# cross-FFI unwinding regardless of the toolchain version in use.
#
# F-MEM-06 (decision): this workspace-wide `abort` also governs the
# relay, where a per-connection-task panic aborts the whole process
# (every connected peer) rather than dropping one connection. We keep
# `abort` for both crates deliberately: crypto-core REQUIRES it (the
# FFI-unwind safety above), and a split per-crate policy (relay on
# `unwind` + a `catch_unwind` per-task supervisor) is not worth the
# complexity while the real invariant — "no panic reachable from
# untrusted wire input" — holds (the one reachable case, F-MEM-05, is
# fixed and regression-tested). Revisit only if a relay panic path
# turns out to be reachable and unfixable at the source.
[profile.dev]
panic = "abort"
