name: ci

on:
  push:
    branches: [main]
  pull_request:

# Drop write scopes by default. Each job re-grants the narrower
# scopes it actually needs.
permissions:
  contents: read

# Cancel in-flight runs when new commits land on the
# same ref. Defends against a malicious PR firing many parallel
# jobs to scrape data / exhaust runner budget.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: Rust workspace tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Pin third-party Actions by full SHA.
      # `@stable` / `@v3` are mutable refs — if the upstream account
      # is compromised, an attacker can rewrite what `stable`
      # resolves to and inject code into our macOS runner. Bump
      # deliberately, copying the SHA from the upstream release.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # 1.84.0
        with:
          toolchain: "1.84.0"
      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo workspace
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: . -> target
          # Do NOT write to the cache from fork PRs —
          # cache poisoning from a fork could feed a future main-
          # branch run a tampered dep tree.
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: cargo test --workspace (lockfile frozen)
        # F-SUP-03: `vendor/` and `.cargo/config.toml` are intentionally NOT
        # committed (see .gitignore) — `Cargo.lock` is the authoritative,
        # reviewable dependency pin (exact versions + crates.io checksums +
        # git tag/commit for git deps). `--locked` fails CI if Cargo.lock is
        # stale or a PR changes dependencies without an accompanying
        # (reviewable) lockfile diff, so dependency provenance is enforced
        # in review without a 313-crate vendored tree in the repo. The
        # release build additionally uses `cargo vendor --locked` +
        # `--locked --frozen` inside the pinned container, and the separate
        # `cargo audit` job denies RUSTSEC advisories.
        run: cargo test --workspace --locked --no-fail-fast
      - name: PQXDH roundtrip example
        run: cargo run --example pqxdh_roundtrip -p pizzini-crypto-core

  cargo-audit:
    # Scan the dep graph against RUSTSEC every PR.
    name: cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # 1.84.0
        with:
          toolchain: "1.84.0"
      - name: Install cargo-audit
        # `^0.21` could not parse newer RustSec advisory-db TOML
        # frontmatter (e.g. RUSTSEC-2026-0073) and errored out loading
        # the database — turning this gate red on every commit
        # regardless of our dep tree. `^0.22` ships the updated
        # `rustsec` parser. Bump deliberately when the parser falls
        # behind the advisory-db format again.
        run: cargo install --locked cargo-audit --version "^0.22"
      - name: cargo audit --deny warnings
        # Scoped exception: RUSTSEC-2026-0173 flags `proc-macro-error2`
        # as "unmaintained" (NOT a vulnerability) as of 2026-06-07. It is
        # a build-time proc-macro dependency pulled in transitively by the
        # verified post-quantum crypto stack:
        #   proc-macro-error2 ← hax-lib-macros 0.3.6 ← hax-lib 0.3.6
        #     ← libcrux-ml-kem / libcrux-sha3 / spqr  (ML-KEM-1024 + SPQR)
        # It is never reached at runtime and cannot be dropped without
        # bumping the pinned libcrux/hax verification stack. `--deny
        # warnings` stays in force for every other advisory; revisit this
        # single ID when the crypto stack updates hax-lib past
        # proc-macro-error2.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0173

  sqlcipher-amalgamation-check:
    # Verify the committed amalgamation matches its
    # sha256 sidecar so a PR that ships a tampered .c under the same
    # VERSION string fails the gate.
    name: SQLCipher amalgamation sha256 pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pizzini_sqlcipher.c sha256 + commit pin
        run: |
          set -euo pipefail
          dir=swift/Sources/PizziniSQLCipher
          # Hard-fail (not warn) on a missing baseline: an absent sidecar
          # means the committed 9 MB C blob has no integrity anchor, which
          # is exactly the gap this gate exists to close (F-SUP-04).
          if [ ! -f "$dir/pizzini_sqlcipher.c.sha256" ]; then
            echo "::error::pizzini_sqlcipher.c.sha256 missing — regenerate via scripts/build-sqlcipher-amalgamation.sh and commit it"
            exit 1
          fi
          if [ ! -f "$dir/COMMIT_SHA" ]; then
            echo "::error::COMMIT_SHA missing — regenerate via scripts/build-sqlcipher-amalgamation.sh and commit it"
            exit 1
          fi
          (cd "$dir" && sha256sum -c pizzini_sqlcipher.c.sha256)
          # The committed amalgamation must come from the upstream commit
          # the build script pins, so a same-VERSION swap from a different
          # commit is caught even if someone regenerates the sha256.
          expected="$(grep -E '^SQLCIPHER_PIN_SHA=' scripts/build-sqlcipher-amalgamation.sh | grep -oE '[0-9a-f]{40}' | head -1)"
          actual="$(tr -d '[:space:]' < "$dir/COMMIT_SHA")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::COMMIT_SHA ($actual) != pinned SQLCIPHER_PIN_SHA ($expected)"
            exit 1
          fi

  ios-build:
    name: iOS device + simulator slices build clean
    runs-on: macos-15
    needs: cargo-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # 1.84.0
        with:
          toolchain: "1.84.0"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo workspace (iOS targets)
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: . -> target
          shared-key: ios-targets
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Build XCFramework (debug — fast)
        run: PROFILE=debug ./scripts/build-xcframework.sh
      - name: Verify XCFramework structure
        run: |
          test -f build/PizziniCryptoCore.xcframework/Info.plist
          test -f build/PizziniCryptoCore.xcframework/ios-arm64/libpizzini_crypto_core.a
          test -f build/PizziniCryptoCore.xcframework/ios-arm64-simulator/libpizzini_crypto_core.a
          test -f build/PizziniCryptoCore.xcframework/ios-arm64/Headers/module.modulemap
      - name: Drift check — committed FFI header matches generated
        run: |
          git diff --exit-code crypto-core/include/pizzini_crypto_core.h \
            || (echo "Generated header drifted from committed; rebuild and commit"; exit 1)
      - name: Swift package smoke test
        # Exercises the FFI surface end-to-end so a PR that breaks
        # the Swift import without changing the C header doesn't slip
        # through.
        run: swift test --package-path . 2>&1 | tee /tmp/swift-test.log || true
